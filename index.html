<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Workspace | Cyber Edition</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
</head>
<body>
  <!-- Animated Background & Grid -->
  <div class="animated-bg"></div>
  <div class="grid-overlay"></div>

  <div class="browser-shell">
    <header class="toolbar glass-panel">
      <div class="brand glow-text">Net<span class="neon-pink">Runner</span></div>
      <div class="nav-cluster">
        <button class="ctrl-btn" id="btn-back" title="Navigate Back">◀</button>
        <button class="ctrl-btn" id="btn-forward" title="Navigate Forward">▶</button>
        <button class="ctrl-btn" id="btn-refresh" title="Reload Frame">↻</button>
        <button class="ctrl-btn" id="btn-home" title="Return Home">HOME</button>
      </div>
      <div class="search-region">
        <input type="text" id="url-input" class="address-input" placeholder="Enter endpoint or search query...">
        <button id="btn-bookmark" class="meta-action-btn">SAVE</button>
        <button id="btn-popout" class="meta-action-btn">POPOUT</button>
        <button class="submit-go-btn" id="btn-go">INITIATE</button>
      </div>
      <div class="aux-cluster">
        <button class="aux-trigger" id="btn-show-bookmarks">Bookmarks</button>
        <button class="aux-trigger" id="btn-show-history">History</button>
        <button class="profile-auth-btn" id="btn-profile">SYSTEM_AUTH</button>
      </div>
    </header>
    
    <main class="viewport-canvas" id="main-content">
      <div class="landing-surface" id="placeholder">
        <div class="hero-block">
          <h1 class="welcome-heading glow-text" id="welcome-text">Neural Workspace</h1>
          <p class="hero-subtext">Live data streams, secure local persistence, and encrypted indexing.</p>
        </div>
        
        <div class="shortcut-grid">
          <div class="shortcut-card site-shortcut glass-panel neon-hover" data-url="https://www.google.com/webhp?igu=1">
            <span class="glyph-badge">G</span>
            <span class="card-label">Google</span>
          </div>
          <div class="shortcut-card site-shortcut glass-panel neon-hover" data-url="https://duckduckgo.com/">
            <span class="glyph-badge pink-badge">D</span>
            <span class="card-label">DuckDuckGo</span>
          </div>
          <div class="shortcut-card site-shortcut glass-panel neon-hover" data-url="https://en.wikipedia.org/wiki/Main_Page">
            <span class="glyph-badge">W</span>
            <span class="card-label">Wikipedia</span>
          </div>
        </div>

        <section class="wire-stream-section">
          <div class="stream-header">
            <h3 class="stream-title glow-text">Live Global Feed</h3>
            <div class="category-filters" id="gn-categories">
              <button class="filter-tab active" data-cat="Home">Top Stories</button>
              <button class="filter-tab" data-cat="Technology">Technology</button>
              <button class="filter-tab" data-cat="Business">Markets</button>
              <button class="filter-tab" data-cat="Science">Science</button>
            </div>
          </div>
          
          <div class="wire-feed-grid" id="news-feed"></div>
          <div id="loading-spinner" class="stream-status-indicator pulse-anim">Establishing uplink to news servers...</div>
        </section>
      </div>
      
      <iframe id="browser-frame" class="active-frame" style="display: none;" sandbox="allow-same-origin allow-scripts allow-popups allow-forms"></iframe>
    </main>
  </div>
  
  <aside class="floating-media-dock glass-panel neon-border-pink">
    <div class="dock-header" id="music-toggle">
      <span>Audio Sync</span>
      <span id="music-icon" class="neon-pink">HIDE</span>
    </div>
    <div class="dock-body" id="music-body">
      <iframe src="https://open.spotify.com/embed/playlist/37i9dQZEVXbMDoHDwVN2tF?utm_source=generator&theme=0" width="100%" height="152" frameborder="0" allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"></iframe>
    </div>
  </aside>

  <!-- Modals remain structurally the same, styled by CSS -->
  <div id="library-modal" class="modal-backdrop">
    <div class="modal-dialog glass-panel neon-border-cyan">
      <button class="modal-close-trigger" id="close-library">X</button>
      <div class="split-library-layout">
        <nav class="library-nav">
          <button class="lib-nav-item active" data-target="bookmarks-view" id="tab-bookmarks">Bookmarks</button>
          <button class="lib-nav-item" data-target="history-view" id="tab-history">Telemetry Log</button>
        </nav>
        <section class="library-content-pane">
          <div id="bookmarks-view" class="library-panel">
            <div class="panel-header">
              <h3>Saved Endpoints</h3>
              <button class="action-danger-btn" id="clear-bookmarks">Purge All</button>
            </div>
            <ul id="bookmarks-list" class="data-record-list"></ul>
          </div>
          <div id="history-view" class="library-panel" style="display: none;">
            <div class="panel-header">
              <h3>Session Telemetry</h3>
              <button class="action-danger-btn" id="clear-history">Purge History</button>
            </div>
            <ul id="history-list" class="data-record-list"></ul>
          </div>
        </section>
      </div>
    </div>
  </div>

  <div id="auth-modal" class="modal-backdrop">
    <div class="modal-dialog glass-panel neon-border-pink" style="max-width: 400px; height: auto; padding: 30px;">
      <button class="modal-close-trigger" id="close-modal">X</button>
      <div class="auth-header">
        <h2 class="glow-text">System Auth</h2>
        <p>Enter operator credentials</p>
      </div>
      <form id="auth-form" class="auth-form-stack">
        <input type="text" id="auth-name" placeholder="Operator Alias" required>
        <input type="email" id="auth-email" placeholder="Secure Email" required>
        <button type="submit" class="submit-primary-btn">DECRYPT SESSION</button>
      </form>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
